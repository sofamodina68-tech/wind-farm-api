worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;

  # Лимит размера тела запроса (у API лимит 100kb — Nginx пропускает чуть больше)
  client_max_body_size 200k;

  # Таймауты проксирования
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  # Заголовки, которые не отдаём наружу
  server_tokens off;

  upstream api_upstream {
    server api:3000;
  }

  server {
    listen 80;
    server_name _;

    # Проксируем всё на API, включая /api/health, /api/auth, /api/equipment и т.д.
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;

      # Заголовки для trust proxy в Express
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket (не используем, но на будущее)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Опционально: Swagger UI (появится на Кейсе 4 позже)
    # location /api/docs {
    #   proxy_pass http://api_upstream;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # Метрики и Grafana — ограничим позже
    # location /metrics { deny all; return 403; }
    # location /grafana/ { proxy_pass http://grafana:3000/; }

    # Healthcheck для самого Nginx
    location = /nginx-health {
      access_log off;
      return 200 "nginx ok\n";
    }

    # Все остальные пути — 404
    location / {
      return 404 "Not found\n";
    }
  }
}