worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;

  # Лимит размера тела запроса (у API лимит 100kb — Nginx пропускает чуть больше)
  client_max_body_size 200k;

  # Таймауты проксирования
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  # Заголовки, которые не отдаём наружу
  server_tokens off;

  upstream api_upstream {
    server api:3000;
  }

  upstream grafana_upstream {
    server grafana:3000;
  }

  server {
    listen 80;
    server_name _;

    # ---- Swagger UI ----
    location /api/docs {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API ----
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # ---- Метрики Prometheus ----
    location = /metrics {
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      allow 127.0.0.1;
      deny all;

      proxy_pass http://api_upstream/metrics;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- Grafana UI ----
    location /grafana/ {
      proxy_pass http://grafana_upstream/grafana/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_read_timeout 300;
      proxy_send_timeout 300;
    }

    # ---- Healthcheck Nginx ----
    location = /nginx-health {
      access_log off;
      return 200 "nginx ok\n";
    }

    # ---- Все остальные пути — 404 ----
    location / {
      return 404 "Not found\n";
    }
  }
}